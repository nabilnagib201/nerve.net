plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nervenet.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nervenet.app'
        minSdk 15
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig false
    }
}
